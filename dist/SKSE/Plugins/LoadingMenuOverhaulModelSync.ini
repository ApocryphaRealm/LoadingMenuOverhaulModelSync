; Loading Menu Overhaul Model Sync
; The compiled defaults are exactly these values (project rule 16).

[General]
; 1 = the 3D model follows the hint when Loading Menu Overhaul swipes; 0 = do nothing.
bEnabled=1

[MinimumTime]
; 1 = a loading screen that finishes early stays up (backdrop, model, hints) until fMinimumLoadingSeconds have
; passed since it appeared, so there is time to read and swipe; 0 = loading screens end as soon as the game is ready.
bMinimumLoadingTime=1
; Seconds counted from the moment the loading screen appears. 20 by default; 0 turns the minimum off.
; A load that takes longer than this is never held.
fMinimumLoadingSeconds=20
; 1 = door and fast-travel loads are held too. 0 (default) = only a load from the main menu is held: while a cell
; transition is held, Loading Menu Overhaul's prompt art and hint cycling can stall until a bumper is pressed.
bHoldCellTransitions=0

[Debug]
; 0 = trace, 1 = debug, 2 = info. Log: Documents\My Games\Skyrim Special Edition\SKSE\LoadingMenuOverhaulModelSync.log
uLogLevel=0